<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow</title>
    <style>
        body { background: #0f111a; color: #f3f4f6; font-family: Arial, Helvetica, sans-serif;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .box { text-align: center; max-width: 480px; padding: 32px; border: 1px solid #2d3142;
               border-radius: 16px; background: #191c29; }
        code { background: #222638; padding: 2px 6px; border-radius: 6px; color: #c4b5fd; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Task Flow</h1>
        <p>Aplikacja frontendowa nie została jeszcze zbudowana.</p>
        <p>Uruchom w katalogu <code>frontend/</code>:</p>
        <p><code>npm install</code> a następnie <code>npm run build</code></p>
    </div>
</body>
</html>
